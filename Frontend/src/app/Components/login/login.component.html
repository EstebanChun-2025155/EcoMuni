<div class="bg-blur" aria-hidden="true"></div>

<div
  class="notificacion"
  [class.mostrar]="notificacionVisible()"
  [class.exito]="notificacionExito()"
  role="alert"
  aria-live="assertive"
>
  {{ notificacion() }}
</div>

<main class="card-container">
  <section class="form-side" aria-labelledby="titulo-login">
    <h1 id="titulo-login">Bienvenido a EcoMuni</h1>
    <p class="tagline">Plataforma municipal de gestión ambiental · Guatemala</p>

    <form #formulario="ngForm" (ngSubmit)="ingresar(formulario)" [attr.aria-busy]="cargando()">
      <div class="input-group">
        <label for="correo">Correo electrónico</label>
        <div class="campo-clave">
          <svg
            class="icono-campo"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 7-10 6L2 7" />
          </svg>
          <input
            id="correo"
            name="correo"
            type="email"
            autocomplete="username"
            placeholder="nombre@correo.com"
            [(ngModel)]="correo"
            required
            email
            maxlength="120"
            [disabled]="cargando()"
          />
        </div>
      </div>

      <div class="input-group">
        <label for="contrasena">Contraseña</label>
        <div class="campo-clave">
          <svg
            class="icono-campo"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            id="contrasena"
            name="contrasena"
            [type]="mostrarContrasena() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            [(ngModel)]="contrasena"
            required
            [disabled]="cargando()"
          />
          <button
            type="button"
            class="ojo-btn"
            (click)="alternarContrasena()"
            [disabled]="cargando()"
            [attr.aria-label]="mostrarContrasena() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarContrasena()) {
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12Q12 19 22 12" />
                <path d="M6 14.5l-1.5 2" />
                <path d="M12 15.8v2.2" />
                <path d="M18 14.5l1.5 2" />
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button class="submit-btn" type="submit" [disabled]="cargando()">
        @if (cargando()) {
          <svg
            class="spinner"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        }
        {{ cargando() ? 'Verificando…' : 'Ingresar' }}
      </button>
    </form>
  </section>

  <div class="image-side" aria-hidden="true"></div>
</main>

<a class="btn-inferior" routerLink="/register">¿No tienes cuenta? Regístrate</a>
